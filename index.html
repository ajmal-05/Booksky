<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<body>
    <div class="navbar">
        <h1>Booksky</h1>
    </div>

    <div class="container">
        <div class="book-container">
            <h2>Rich Dad Poor Dad</h2>
            <h5>Author</h5>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Doloribus officiis dicta mollitia quaerat suscipit laboriosam voluptates dolorem placeat libero, totam, fugit molestias expedita, quam amet saepe alias quidem vero cum.</p>
            <button onclick="deleteitem(event)">Delete</button>
        </div>
    </div>

    

    <div class="popup-overlay"></div>
    <div class="popup-box">
        <h1>Add Book</h1>
        <form >
            <input type="text" placeholder="Enter Book Name" id="book-name-input">
            <input type="text" placeholder="Book Author" id="author-name-input">
            <textarea name="" placeholder="Short Description" id="book-description"></textarea>
            <button class="addbook">ADD</button>
            <button class="cancelbutton" >CANCEL</button>
        </form>
    </div>
    
    <button  class="add-button" id="popup-button">+</button>
    <script src="script.js"></script>
</body>
</html>
